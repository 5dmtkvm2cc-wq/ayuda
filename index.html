<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Dashboard Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="header">
    <div>
      <span class="lamp-mark">🪔</span>
      <h1>Mi Dashboard Escolar</h1>
      <p id="fecha-actual">Cargando fecha…</p>
    </div>
    <div id="widget-clima" class="clima-box">📍 Cargando clima…</div>
  </header>

  <div id="lluvia-alerta" class="lluvia-alerta">☁️ Consultando pronóstico de lluvia…</div>

  <div class="stats" id="stats-strip"></div>

  <main class="grid">
    <section class="panel principal is-open" id="panel-hoy">
      <h2>📚 Materias de hoy</h2>
      <div id="contenedor-materias-hoy" class="materias-list"></div>
    </section>

    <section class="panel secundario" id="panel-lateral">
      <div>
        <h2>🚨 Tareas pendientes</h2>
        <div id="contenedor-tareas-globales"><p class="mensaje-vacio">Cargando tareas…</p></div>
      </div>
      <div>
        <h2>🔗 Recursos por materia</h2>
        <div id="contenedor-recursos-globales"><p class="mensaje-vacio">Cargando enlaces…</p></div>
      </div>
    </section>
  </main>

</div>

<nav class="tabs">
  <button class="tab-btn active" data-target="panel-hoy"><span class="ic">📚</span>Hoy</button>
  <button class="tab-btn" data-target="panel-lateral"><span class="ic">🚨</span>Pendientes</button>
</nav>

<script src="script.js"></script>
</body>
</html>
