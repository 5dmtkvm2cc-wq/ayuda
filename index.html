<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Spotify Web</title>
    <!-- Vinculamos el archivo CSS de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <h2 class="logo">🎵 Spotifake</h2>
            <nav class="nav-links">
                <a href="#" class="active">🏠 Inicio</a>
                <a href="#">🔍 Buscar</a>
                <a href="#">📚 Tu Biblioteca</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- BUSCADOR SUPERIOR -->
            <header class="top-header">
                <input type="text" id="input-busqueda" placeholder="¿Qué quieres escuchar hoy?">
            </header>

            <!-- SECCIÓN DE CANCIONES -->
            <section class="music-section">
                <h2>Canciones Populares</h2>
                
                <div class="songs-grid" id="songs-grid">
                    
                    <!-- TARJETA 1 -->
                    <div class="song-card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMVhRbjBpwbW4vX7DP41KjspsbFGVeAlGFC9pYfxpSPw&s" alt="Cover">
                        <h3>Un Verano Sin Ti</h3>
                        <p>Bad Bunny</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                    <!-- TARJETA 2 -->
                    <div class="song-card">
                        <img src="https://i.scdn.co/image/ab67616d0000b273e9a9de396bb621a2822fb278" alt="Cover">
                        <h3>MICRODOSIS</h3>
                        <p>Mora</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                    <!-- TARJETA 3 -->
                    <div class="song-card">
                        <img src="https://i.scdn.co/image/ab67616d0000b273f885fb64a381318a1c9c14e4" alt="Cover">
                        <h3>DATA</h3>
                        <p>Tainy</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <!-- REPRODUCTOR INFERIOR FIJO -->
    <footer class="player-bar">
        
        <!-- INFO DE CANCIÓN ACTUAL -->
        <div class="current-track">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMVhRbjBpwbW4vX7DP41KjspsbFGVeAlGFC9pYfxpSPw&s" alt="Track Cover" id="player-img">
            <div>
                <h4 id="player-title">Un Verano Sin Ti</h4>
                <p id="player-artist">Bad Bunny</p>
            </div>
        </div>

        <!-- CONTROLES Y BARRA DE PROGRESO -->
        <div class="player-controls">
            <div class="buttons">
                <button class="btn-control">⏮</button>
                <button class="btn-play-main" id="btn-play-main">▶</button>
                <button class="btn-control">⏭</button>
            </div>
            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="time-total">3:30</span>
            </div>
        </div>

        <!-- ESPACIO RESERVADO PARA VOLUMEN -->
        <div class="player-volume">
            <span>🔊</span>
            <input type="range" id="volume-bar" value="80" min="0" max="100">
        </div>
    </footer>
    <!-- Elemento de audio invisible que procesará los archivos .mp3 -->
    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>
