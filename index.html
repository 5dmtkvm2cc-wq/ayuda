<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Estudiantil Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <div>
            <h1>Mi Dashboard Escolar 🎒</h1>
            <p id="fecha-actual">Cargando fecha...</p>
        </div>
        <div id="widget-clima" class="clima-box">
            🌤️ Cargando clima de San Julián...
        </div>
    </header>

    <!-- SISTEMA DE PROGRESO -->
    <section class="panel progreso-panel">
        <h2>📊 Rendimiento de la Semana</h2>
        <div class="barra-progreso-contenedor">
            <div id="barra-progreso" class="barra-progreso" style="width: 0%;">0%</div>
        </div>
        <div class="estadisticas-grid" id="estadisticas-grid">
            <!-- Se llenará con JS -->
        </div>
    </section>

    <main class="dashboard-grid">
        <!-- SECCIÓN 1: Materias de Hoy y Tareas -->
        <section class="panel principal">
            <h2>📚 Clases del Día</h2>
            <div id="contenedor-materias-hoy" class="materias-list"></div>
        </section>

        <!-- SECCIÓN 2: Tareas Globales y Recursos -->
        <section class="panel secundario">
            <h2>🚨 Tareas Pendientes <span id="filtro-fecha" class="badge-filtro"></span></h2>
            <div id="contenedor-tareas-globales">
                <p>Cargando tareas...</p>
            </div>

            <h2 class="titulo-seccion-recursos">📅 Calendario de Entregas</h2>
            <div id="calendario-contenedor" class="calendario">
                <!-- Se llenará con JS -->
            </div>

            <h2 class="titulo-seccion-recursos">🔗 Recursos por Materia</h2>
            <div id="contenedor-recursos-globales">
                <p>Cargando enlaces...</p>
            </div>
        </section>
    </main>

    <!-- MODAL: POSPONER INTELIGENTE -->
    <dialog id="modal-posponer" class="modal">
        <h3>⏩ Posponer Tarea</h3>
        <p id="posponer-texto-tarea"></p>
        <div class="posponer-opciones">
            <button onclick="ejecutarPosponer(1)">Mañana</button>
            <button onclick="ejecutarPosponer(2)">Pasado Mañana</button>
            <input type="datetime-local" id="posponer-fecha-custom">
            <button onclick="ejecutarPosponer('custom')" class="btn-primario">Elegir Fecha</button>
        </div>
        <button onclick="cerrarModalPosponer()" class="btn-cerrar">Cancelar</button>
    </dialog>

    <!-- MODAL: REPORTE SEMANAL (DOMINGOS) -->
    <dialog id="modal-reporte" class="modal modal-reporte">
        <h2>📈 Resumen de tu Semana</h2>
        <div id="reporte-contenido"></div>
        <button onclick="document.getElementById('modal-reporte').close()" class="btn-primario">¡A descansar!</button>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
