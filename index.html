<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <div>
            <h1>Mi Dashboard Escolar 🎒</h1>
            <p id="fecha-actual">Cargando fecha...</p>
        </div>
        <!-- Aquí irá nuestro widget del clima más adelante -->
        <div id="widget-clima" class="clima-box">
            🌤️ Revisando el cielo...
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- SECCIÓN 1: Lo que toca hoy -->
        <section class="panel principal">
            <h2>📚 Materias de Hoy</h2>
            <!-- JavaScript llenará este div dependiendo del día de la semana -->
            <div id="contenedor-materias-hoy" class="materias-list"></div>
        </section>

        <!-- SECCIÓN 2: Resumen de Tareas (Lo armaremos en el Bloque 2) -->
        <section class="panel secundario">
            <h2>🚨 Tareas Pendientes</h2>
            <div id="contenedor-tareas-globales">
                <p>Aquí veremos las tareas filtradas por urgencia.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
