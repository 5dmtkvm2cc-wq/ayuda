<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Spotify Web</title>
    <!-- Vinculamos el archivo CSS de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<style>
        /* ESTILOS GENERALES MODO OSCURO */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #000000;
        color: #ffffff;
        height: 100vh;
        overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL */
    .app-container {
        display: flex;
        height: calc(100vh - 90px); /* Deja 90px para el reproductor inferior */
    }

    /* SIDEBAR */
    .sidebar {
        width: 240px;
        background-color: #000000;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .logo {
        color: #1db954; /* Verde Spotify */
        font-size: 22px;
    }

    .nav-links a {
        display: block;
        color: #b3b3b3;
        text-decoration: none;
        font-weight: bold;
        padding: 10px 0;
        transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
        color: #ffffff;
    }

    /* CONTENIDO PRINCIPAL */
    .main-content {
        flex: 1;
        background: linear-gradient(to bottom, #1e1e1e, #121212);
        padding: 20px 30px;
        overflow-y: auto;
    }

    /* BUSCADOR */
    .top-header input {
        background-color: #242424;
        border: none;
        padding: 12px 20px;
        border-radius: 50px;
        color: white;
        width: 300px;
        font-size: 14px;
        outline: none;
        margin-bottom: 30px;
    }

    /* GRID DE CANCIONES */
    .music-section h2 {
        margin-bottom: 20px;
    }

    .songs-grid {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .song-card {
        background-color: #181818;
        padding: 16px;
        border-radius: 8px;
        width: 180px;
        position: relative;
        transition: background-color 0.3s ease;
        cursor: pointer;
    }

    .song-card:hover {
        background-color: #282828;
    }

    .song-card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 12px;
    }

    .song-card h3 {
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .song-card p {
        font-size: 13px;
        color: #b3b3b3;
        margin-top: 4px;
    }

    .btn-play-card {
        position: absolute;
        bottom: 80px;
        right: 25px;
        background-color: #1db954;
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        color: black;
        font-size: 16px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .song-card:hover .btn-play-card {
        opacity: 1;
        transform: translateY(-5px);
    }

    /* REPRODUCTOR INFERIOR FIJO */
    .player-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 90px;
        background-color: #181818;
        border-top: 1px solid #282828;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
    }

    .current-track {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 25%;
    }

    .current-track img {
        width: 56px;
        height: 56px;
        border-radius: 4px;
        object-fit: cover;
    }

    .current-track h4 { font-size: 14px; }
    .current-track p { font-size: 12px; color: #b3b3b3; }

    /* CONTROLES */
    .player-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 45%;
    }

    .buttons {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .btn-control {
        background: none;
        border: none;
        color: #b3b3b3;
        font-size: 16px;
        cursor: pointer;
    }

    .btn-play-main {
        background-color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 16px;
        cursor: pointer;
    }

    .progress-container {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        font-size: 12px;
        color: #b3b3b3;
    }

    .progress-container input[type="range"] {
        flex: 1;
        accent-color: #1db954;
    }

    .player-volume {
        width: 25%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
    }

    .player-volume input[type="range"] {
        accent-color: #1db954;
    }
</style>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <h2 class="logo">🎵 Spotifake</h2>
            <nav class="nav-links">
                <a href="#" class="active">🏠 Inicio</a>
                <a href="#">🔍 Buscar</a>
                <a href="#">📚 Tu Biblioteca</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            
            <!-- BUSCADOR SUPERIOR -->
            <header class="top-header">
                <input type="text" id="input-busqueda" placeholder="¿Qué quieres escuchar hoy?">
            </header>

            <!-- SECCIÓN DE CANCIONES -->
            <section class="music-section">
                <h2>Canciones Populares</h2>
                
                <div class="songs-grid" id="songs-grid">
                    
                    <!-- TARJETA 1 -->
                    <div class="song-card">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMVhRbjBpwbW4vX7DP41KjspsbFGVeAlGFC9pYfxpSPw&s" alt="Cover">
                        <h3>Un Verano Sin Ti</h3>
                        <p>Bad Bunny</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                    <!-- TARJETA 2 -->
                    <div class="song-card">
                        <img src="https://i.scdn.co/image/ab67616d0000b273e9a9de396bb621a2822fb278" alt="Cover">
                        <h3>MICRODOSIS</h3>
                        <p>Mora</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                    <!-- TARJETA 3 -->
                    <div class="song-card">
                        <img src="https://i.scdn.co/image/ab67616d0000b273f885fb64a381318a1c9c14e4" alt="Cover">
                        <h3>DATA</h3>
                        <p>Tainy</p>
                        <button class="btn-play-card">▶</button>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <!-- REPRODUCTOR INFERIOR FIJO -->
    <footer class="player-bar">
        
        <!-- INFO DE CANCIÓN ACTUAL -->
        <div class="current-track">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" alt="Track Cover" id="player-img">
            <div>
                <h4 id="player-title">Un Verano Sin Ti</h4>
                <p id="player-artist">Bad Bunny</p>
            </div>
        </div>

        <!-- CONTROLES Y BARRA DE PROGRESO -->
        <div class="player-controls">
            <div class="buttons">
                <button class="btn-control">⏮</button>
                <button class="btn-play-main" id="btn-play-main">▶</button>
                <button class="btn-control">⏭</button>
            </div>
            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="time-total">3:30</span>
            </div>
        </div>

        <!-- ESPACIO RESERVADO PARA VOLUMEN -->
        <div class="player-volume">
            <span>🔊</span>
            <input type="range" id="volume-bar" value="80" min="0" max="100">
        </div>
    </footer>

    <!-- Vinculamos el JS de lógica -->
    <script src="script.js"></script>
</body>
</html>
