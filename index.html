<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="dashboard-header">
        <div>
            <h1>Mi Dashboard Escolar 🎒</h1>
            <p id="fecha-actual">Cargando fecha...</p>
        </div>
        <div id="widget-clima" class="clima-box">
            🌤️ Cargando clima de San Julián...
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- SECCIÓN 1: Materias de Hoy y Tareas -->
        <section class="panel principal">
            <h2>📚 Materias de Hoy</h2>
            <div id="contenedor-materias-hoy" class="materias-list"></div>
        </section>

        <!-- SECCIÓN 2: Tareas Globales y Recursos -->
        <section class="panel secundario">
            <h2>🚨 Tareas Pendientes</h2>
            <div id="contenedor-tareas-globales">
                <p>Cargando tareas...</p>
            </div>

            <h2 class="titulo-seccion-recursos">🔗 Recursos por Materia</h2>
            <div id="contenedor-recursos-globales">
                <p>Cargando enlaces...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
