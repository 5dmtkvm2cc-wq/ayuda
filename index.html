<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Escritorio Nocturno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="header">
    <div>
      <span class="lamp-mark">🪔</span>
      <h1>Mi escritorio nocturno</h1>
      <p id="fecha-actual">Cargando fecha…</p>
    </div>
    <div id="widget-clima" class="clima-box">📍 Cargando clima…</div>
  </header>

  <div id="lluvia-alerta" class="lluvia-alerta">☁️ Consultando pronóstico de lluvia…</div>
  <div id="recordatorios" class="recordatorios"></div>

  <div class="stats" id="stats-strip"></div>

  <main class="grid">
    <section class="panel principal is-open" id="panel-hoy">
      <h2>📚 Materias de hoy</h2>
      <div id="contenedor-materias-hoy" class="materias-list"></div>
    </section>

    <section class="panel secundario" id="panel-lateral">
      <div>
        <h2>🚨 Tareas pendientes</h2>
        <div id="contenedor-tareas-globales"><p class="mensaje-vacio">Cargando tareas…</p></div>
      </div>
      <div>
        <h2>🔗 Recursos por materia</h2>
        <div id="contenedor-recursos-globales"><p class="mensaje-vacio">Cargando enlaces…</p></div>
      </div>
    </section>
  </main>

  <main class="grid grid-2">
    <section class="panel" id="panel-calendario">
      <h2>🗓️ Calendario escolar</h2>
      <div class="cal-nav">
        <button class="btn ghost" onclick="cambiarMes(-1)">‹</button>
        <span id="cal-mes-label"></span>
        <button class="btn ghost" onclick="cambiarMes(1)">›</button>
      </div>
      <div class="cal-dias-semana">
        <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
      <div id="calendario-grid" class="cal-grid"></div>
      <div id="calendario-dia-detalle" class="cal-detalle"></div>
    </section>

    <section class="panel" id="panel-progreso">
      <h2>📈 Progreso semanal</h2>
      <div id="progreso-barra-wrap">
        <div class="progreso-barra"><div id="progreso-fill" class="progreso-fill"></div></div>
        <p id="progreso-texto" class="progreso-texto"></p>
      </div>
      <div class="stats" id="progreso-stats"></div>
      <h2 style="margin-top:1.2rem">🗒️ Reporte de la semana</h2>
      <div id="reporte-semanal"></div>
    </section>
  </main>

</div>

<nav class="tabs">
  <button class="tab-btn active" data-target="panel-hoy"><span class="ic">📚</span>Hoy</button>
  <button class="tab-btn" data-target="panel-lateral"><span class="ic">🚨</span>Pendientes</button>
  <button class="tab-btn" data-target="panel-calendario"><span class="ic">🗓️</span>Calendario</button>
  <button class="tab-btn" data-target="panel-progreso"><span class="ic">📈</span>Progreso</button>
</nav>

<script src="script.js"></script>
</body>
</html>
